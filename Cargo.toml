[package]
name = "guitarforge"
version = "0.3.0"
edition = "2024"
description = "Amp de guitarra digital para o cabo Rocksmith USB"
license = "MIT"

[dependencies]
anyhow = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = "0.30"
egui = "0.30"
env_logger = "0.11"
hound = "3.5"
log = "0.4"
realfft = "3"
rfd = "0.15"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Threading"] }

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"

[build-dependencies]
embed-resource = "3.0.12"
